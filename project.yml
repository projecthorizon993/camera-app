name: CameraApp
options:
  bundleIdPrefix: com.jaca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CameraApp:
    type: application
    platform: iOS
    sources:
      - path: CameraApp
        excludes:
          - "**/.gitkeep"
    info:
      path: CameraApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "CameraApp needs the camera to capture photos and video."
        NSMicrophoneUsageDescription: "CameraApp needs the microphone to record video with audio."
        NSPhotoLibraryAddUsageDescription: "CameraApp saves captures to your photo library."
        NSLocationWhenInUseUsageDescription: "CameraApp can geotag captures if you enable it."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  CameraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CameraAppTests
    dependencies:
      - target: CameraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CameraApp.app/CameraApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CameraApp:
    build:
      targets:
        CameraApp: all
        CameraAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CameraAppTests
