name: iOS Build
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            echo "::warning::Xcode 26 not found; falling back to $XCODE_APP"
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: List project schemes
        run: xcodebuild -list -project CameraApp.xcodeproj
      - name: Compile check (simulator)
        run: >
          xcodebuild -project CameraApp.xcodeproj -scheme CameraApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned IPA
        run: |
          xcodebuild archive -project CameraApp.xcodeproj -scheme CameraApp \
            -archivePath build/CameraApp.xcarchive -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R "build/CameraApp.xcarchive/Products/Applications/CameraApp.app" build/Payload/
          cd build && zip -qry CameraApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: build/CameraApp.ipa
          if-no-files-found: error

  test:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            echo "::warning::Xcode 26 not found; falling back to $XCODE_APP"
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Discover simulator destination
        run: |
          DEST="$(DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -showdestinations -scheme CameraApp 2>&1 | \
            awk '/platform:iOS Simulator/ && !/Placeholder/ {
              match($0, /id:[^,]+/); id=substr($0, RSTART+3, RLENGTH-3); gsub(/[[:space:]]/, "", id);
              if(id!="") {
                print "platform=iOS Simulator,id="id;
                exit
              }
            }')"
          if [ -z "$DEST" ]; then
            echo "::error::No real iOS Simulator destination found (placeholders cannot run tests)"
            echo "::group::showdestinations output"
            DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -showdestinations -scheme CameraApp 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi
          echo "SIM_DEST=$DEST" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: >
          xcodebuild -project CameraApp.xcodeproj -scheme CameraApp
          -configuration Debug -sdk iphonesimulator
          -destination "$SIM_DEST"
          test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check extraction scripts
        if: hashFiles('scripts/**/*.py') != ''
        run: python -m compileall scripts
